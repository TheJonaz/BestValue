<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="face" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.35" stop-color="#ffd54a"/>
      <stop offset="0.75" stop-color="#e09a12"/>
      <stop offset="1" stop-color="#9a5a05"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.5" stop-color="#c47a0a"/>
      <stop offset="1" stop-color="#6b3a02"/>
    </linearGradient>
    <linearGradient id="inner" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="1" stop-color="#8a4d04"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1f8a1f"/>
      <stop offset="1" stop-color="#7cff6b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- coin -->
  <g filter="url(#shadow)">
    <circle cx="120" cy="132" r="104" fill="url(#rim)"/>
    <circle cx="120" cy="132" r="88" fill="url(#face)"/>
    <circle cx="120" cy="132" r="76" fill="none" stroke="url(#inner)" stroke-width="5"/>
    <!-- embossed crown -->
    <path d="M78 156 L70 104 L96 126 L120 92 L144 126 L170 104 L162 156 Z"
          fill="#b86d06" transform="translate(2,3)" opacity="0.6"/>
    <path d="M78 156 L70 104 L96 126 L120 92 L144 126 L170 104 L162 156 Z"
          fill="#ffe27a" stroke="#8a4d04" stroke-width="4" stroke-linejoin="round"/>
    <rect x="78" y="160" width="84" height="12" rx="3" fill="#ffe27a" stroke="#8a4d04" stroke-width="4"/>
    <circle cx="70" cy="102" r="7" fill="#fff6c2" stroke="#8a4d04" stroke-width="3"/>
    <circle cx="120" cy="88" r="8" fill="#fff6c2" stroke="#8a4d04" stroke-width="3"/>
    <circle cx="170" cy="102" r="7" fill="#fff6c2" stroke="#8a4d04" stroke-width="3"/>
    <!-- shine -->
    <path d="M62 92 A70 70 0 0 1 112 58" fill="none" stroke="#fffbe6" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- up arrow badge -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="200" r="46" fill="#10240f" stroke="#e8b83a" stroke-width="6"/>
    <path d="M200 166 L228 198 L212 198 L212 228 L188 228 L188 198 L172 198 Z"
          fill="url(#arrow)" stroke="#0b3d0b" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- sparkle -->
  <path d="M218 22 L224 44 L246 50 L224 56 L218 78 L212 56 L190 50 L212 44 Z" fill="#fffbe6"/>
</svg>
